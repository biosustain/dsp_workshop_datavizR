# Render the bookdown site and publish it with GitHub Pages' own deployment
# (Pages "Source" must be set to "GitHub Actions" in Settings -> Pages).
# No Jekyll ever runs: the rendered site is uploaded and served as-is.
#
#   pull request -> render only (build check, nothing published)
#   push to main -> render AND deploy, so editing .Rmd updates the live site.
name: build-and-deploy-website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; don't pile up concurrent ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::bookdown
            any::tidyverse
            any::plotly
            any::ggrepel
            any::pheatmap
            any::patchwork

      - name: Render the book
        working-directory: project
        run: Rscript -e 'bookdown::render_book("index.Rmd", "bookdown::gitbook")'

      - name: Upload the rendered site as a Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/docs

  deploy:
    # Publish only when the change has landed on main.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
