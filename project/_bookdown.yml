book_filename: "DataVizR_Workshop"
output_dir: "docs"
delete_merged_file: true

rmd_files:
  - "index.Rmd"
  - "01_get_the_data.Rmd"
  - "02_first_plot.Rmd"
  - "03_question_distributions.Rmd"
  - "04_question_pca.Rmd"
  - "05_question_gene.Rmd"
  - "06_question_volcano.Rmd"
  - "07_challenge.Rmd"



output:
  bookdown::gitbook:
    split_by: "chapter"       # or "section" if you want every # header to be a sidebar entry
    css: "assets/report.css"
    config:
      toc:
        collapse: section
    includes:
      before_body: "assets/_header-lab.Rmd"
      after_body: "assets/_footer-lab.Rmd"
